[project]
name = "otampy"
version = "4.9.3"
description = "Serial OTA application firmware update solution for MicroPython"
readme = "README.md"
license = "SUL-1.0"
authors = [{ name = "Simon R. Lincoln", email = "oss@codeability.co.uk" }]
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5",
    "click>=8.0.0",
    "rich>=13.0.0",
    "urst-mpy>=3.0.0",
]

[project.urls]
"Homepage" = "https://github.com/simonl65/otampy"
"Bug Tracker" = "https://github.com/simonl65/otampy/issues"

[project.scripts]
otampy = "otampy.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"


# This tells pip/setuptools to ignore the 'hardware' and 'packages' 
# folders and look specifically in the src folder for the code, allowing 
# installation with:
# pipx install git+https://github.com/simonl65/otampy.git@develop
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otampy = ["device/examples/*.py", "device/examples/shared-uart/*.py"]


[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4",
    "micropython-rp2-rpi_pico_w-stubs==1.28.0.*",
    "pytest-watcher>=0.6.3",
    "python-semantic-release>=10.6.0",
]


# --- Ruff ---
[tool.ruff]
src = ["src"]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line length handled by formatter
    "SIM105", # Checks for try-except-pass blocks
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests", "src/otampy/device/tests"]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
addopts = "--cov=otampy --cov-report=term-missing"

# [tool.uv.sources]
# urst = { git = "https://github.com/simonl65/urst-mpy.git" }

[tool.uv.workspace]
members = ["cli"]

[tool.pyright]
include = ["."]
extraPaths = ["./lib", "./src/otampy/deploy.py", "./src/otampy/device/examples"]
ignore = ["**/typings"]
exclude = [
    ".*",
    "__*",
    "**/typings",
    "**/node_modules",
    "**/__pycache__",
    ".venv",
]

typeCheckingMode = "standard"
pythonPlatform = "Linux"
# Pin this repo's own venv explicitly rather than relying on VIRTUAL_ENV
# being set -- without this, pyright silently falls back to whatever
# "python3" is on PATH when run outside an activated venv.
venvPath = "."
venv = ".venv"
# stubPath overlays typings/ on top of the bundled typeshed (pyright
# prefers a matching stub over the bundled module), giving the
# MicroPython-only device/ code (machine, time.ticks_ms, etc.) its real
# signatures without discarding the bundled stdlib -- cli.py/deploy.py/
# tests/ run on the host under CPython and need real dataclasses,
# pathlib, os.environ, etc. This previously used typeshedPath = "typings"
# too, which replaces the typeshed wholesale and silently broke those
# (e.g. every DeployArgs(...) call misreported "No parameter named ...").
stubPath = "typings"

reportMissingModuleSource = "none"

[[tool.pyright.executionEnvironments]]
# conftest.py dynamically constructs a virtual "device_otampy" package
# (importlib.util.spec_from_file_location, registered only in
# sys.modules) to avoid colliding with the host CLI's own "otampy"
# package -- there's no real "device_otampy" folder on disk for pyright
# to resolve, by design. Likewise conftest.py replaces sys.modules
# entries (machine, etc.) with unittest.mock doubles at runtime, which
# pyright statically resolves against the real modules instead, so
# every .reset_mock()/.assert_called_once()/etc. call reports as
# missing on a "FunctionType". Both are inherent to this test
# architecture, not real gaps -- silence them for this directory only.
root = "src/otampy/device/tests"
extraPaths = ["../lib", "."]
reportMissingImports = "none"
reportFunctionMemberAccess = "none"

[tool.semantic_release]
version_variable = "pyproject.toml:version"
branch = "main"
upload_to_pypi = false                      # Set this to true when releases also go to PyPI
